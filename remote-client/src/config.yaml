# RemoteVNC Client Configuration
server:
  # 服务端 WebSocket 地址 (不含 ws:// 前缀，程序会自动拼接)
  ws_url: "ws://localhost:8080/ws/client"
  # 服务端 HTTP 地址 (用于文件上传)
  http_url: "http://localhost:8080"

client:
  # 客户端唯一标识 (建议用机器名或自定义ID)
  client_id: "client-001"

vnc:
  # VNC Server 监听端口
  port: 5900
  # 端口探测范围上限
  max_port: 5905
  # VNC 密码（留空则无需认证）
  password: "remotevnc"
  # 桌面显示名称
  display_name: "RemoteVNC"

recording:
  # 录屏最大时长 (秒)，达到后自动停止并上传，上限 3600 秒 (1 小时)
  max_duration: 3600
  # 默认录屏帧率
  default_fps: 10

heartbeat:
  # 心跳间隔 (秒)
  interval: 15

reconnect:
  # 重连初始等待 (秒)
  initial_delay: 1
  # 重连最大等待 (秒)
  max_delay: 60
