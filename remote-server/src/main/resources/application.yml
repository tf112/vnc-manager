server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/remote_vnc?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# 文件上传存储根目录
file:
  upload-dir: ./uploads

logging:
  level:
    com.remote: DEBUG
